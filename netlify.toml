# No build step — the page is plain files, served as-is.
[build]
  publish = "static"
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

# The API routes come from the functions' own `config.path` exports
# (netlify/functions/quotes.mjs and search.mjs), so no redirects are needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always revalidate, so a redeploy never leaves someone on a stale script.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
