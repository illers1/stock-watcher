<!doctype html>
<meta charset="utf-8">
<title>Stock Watcher tests</title>
<style>
  body { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 24px; }
  h1 { font-size: 15px; }
  .pass { color: #0b8a4a; } .fail { color: #cf2b3d; font-weight: 700; }
  #summary { margin-top: 16px; font-weight: 700; }
</style>
<h1>Stock Watcher — quote parsing and API function tests</h1>
<pre id="out">running…</pre>
<div id="summary"></div>
<script type="module">
/* Imported dynamically with a cache-buster: a plain static file server sends no
   cache headers, so browsers apply heuristic caching and a test run can quietly
   check a stale copy of the very file you just edited. */
const v = "?v=" + Date.now();
const { toFloat, toBig, parseSymbols, buildQuotes } = await import("../netlify/lib/format.mjs" + v);
const { default: quotesFn, config: quotesCfg } = await import("../netlify/functions/quotes.mjs" + v);
const { default: searchFn, config: searchCfg } = await import("../netlify/functions/search.mjs" + v);
const { parseAnalysis, classifyInsiderTrade } = await import("../static/analyze.mjs" + v);
const { default: earningsFn, config: earningsCfg, buildEarnings } =
  await import("../netlify/functions/earnings.mjs" + v);
const { tradingDays } = await import("../netlify/lib/calendar.mjs" + v);
const { parseForm4, summariseInsiders, CODES } = await import("../static/insider-model.mjs" + v);
const { rawDocumentName } = await import("../netlify/lib/insiders.mjs" + v);
const { parseFilingHref, extractOwnershipXml } = await import("../netlify/lib/insider-feed.mjs" + v);
const { scoreShort, squeezeRisk, shortBand, SHORT_FACTORS, SHORT_PRESETS } =
  await import("../static/short-model.mjs" + v);
const { loadWatchlist, DEFAULT_SYMBOLS } = await import("../static/watchlist.mjs" + v);
const { SHORT_FILTERS, INSIDER_FILTERS, CATALYST_FILTERS, EARNINGS_FILTERS, MOVER_FILTERS,
        renderFilterGuide } =
  await import("../static/filter-guide.mjs" + v);
const { buildCandidate, weaknessScore, rankCandidates, SECTORS } =
  await import("../static/screen-model.mjs" + v);
const { filterUniverse, CAP_BANDS, ORDERINGS, parseAsOf } = await import("../netlify/lib/screener.mjs" + v);
const { explainMove, summariseCause, toIsoDate } = await import("../static/movers-model.mjs" + v);
const { sectorMoves } = await import("../netlify/lib/movers.mjs" + v);
const { toIso, longDateToIso, splitDisplayName, regulatoryDate, buildCatalysts,
        countByKind, excerptAround, KINDS, REGULATORY_HORIZON_DAYS } =
  await import("../static/catalysts-model.mjs" + v);
const { money, session, daysAway, parseRow, parseEarnings, summarise } =
  await import("../static/earnings-model.mjs" + v);
const { default: newsFn, config: newsCfg, fetchNews } =
  await import("../netlify/functions/news.mjs" + v);
const { articleUrl, standfirst, parseArticle, parseNewsFeed } =
  await import("../static/news-model.mjs" + v);
const { band, scoreAnalysis, scoreBand, PRESETS, FACTORS } = await import("../static/score.mjs" + v);
const { newCode, parseCode, isValidCode, formatCode, cleanName, cleanSymbol,
        emptyGroup, applyOp, publicView, CODE_LENGTH, MAX_SYMBOLS } =
  await import("../netlify/lib/group.mjs" + v);
const { handleGroup } = await import("../netlify/lib/group-api.mjs" + v);

const results = [];
const check = (name, ok, detail = "") => results.push({ name, ok, detail });
const eq = (name, got, want) =>
  check(name, JSON.stringify(got) === JSON.stringify(want),
        `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);

const fixture = await (await fetch("./fixture.json")).json();
const isoIn = (n) => { const d = new Date(); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

/* ============ parsing ============ */

eq("toFloat plain", toFloat("325.13"), 325.13);
eq("toFloat signed", toFloat("+8.28"), 8.28);
eq("toFloat negative", toFloat("-54.67"), -54.67);
eq("toFloat unicode minus", toFloat("\u2212" + "54.67"), -54.67);
eq("toFloat commas", toFloat("7,631.47"), 7631.47);
eq("toFloat percent", toFloat("+2.61%"), 2.61);
eq("toFloat UNCH", toFloat("UNCH"), null);
eq("toFloat empty", toFloat(""), null);
eq("toFloat null", toFloat(null), null);
eq("toFloat number", toFloat(12.5), 12.5);
eq("toFloat NaN", toFloat(NaN), null);
eq("toFloat garbage", toFloat("abc"), null);

eq("toBig T", toBig("4.745T"), 4.745e12);
eq("toBig M", toBig("49.8M"), 49.8e6);
eq("toBig B", toBig("670B"), 670e9);
eq("toBig raw", toBig("49,839,873"), 49839873);
eq("toBig null", toBig(null), null);

eq("parseSymbols dedupes + uppercases", parseSymbols("aapl,AAPL, msft "), ["AAPL", "MSFT"]);
eq("parseSymbols keeps index/crypto", parseSymbols(".SPX,BTC.CM="), [".SPX", "BTC.CM="]);
eq("parseSymbols drops junk", parseSymbols("AAPL,<script>,MSFT"), ["AAPL", "MSFT"]);
eq("parseSymbols caps at 60",
   parseSymbols(Array.from({length: 80}, (_, i) => "S" + i).join(",")).length, 60);

const quotes = buildQuotes(fixture, ["AAPL", ".SPX", "BTC.CM=", "ZZZQQ", "OMITTED"]);
const by = Object.fromEntries(quotes.map(q => [q.symbol, q]));
eq("order preserved", quotes.map(q => q.symbol), ["AAPL", ".SPX", "BTC.CM=", "ZZZQQ", "OMITTED"]);
eq("AAPL price", by.AAPL.price, 325.13);
eq("AAPL change", by.AAPL.change, 8.28);
eq("AAPL pct", by.AAPL.changePercent, 2.61);
eq("AAPL name", by.AAPL.name, "Apple Inc.");
check("AAPL market cap parsed", by.AAPL.marketCap > 4e12, String(by.AAPL.marketCap));
eq("AAPL extended price", by.AAPL.extended.price, 325.14);
check("AAPL extended pct derived when feed says UNCH",
  Math.abs(by.AAPL.extended.changePercent - ((325.14 - 325.13) / 325.13) * 100) < 1e-9,
  String(by.AAPL.extended.changePercent));
eq(".SPX negative change", by[".SPX"].change, -54.67);
eq(".SPX negative pct keeps its sign", by[".SPX"].changePercent, -0.71);
eq(".SPX has no extended quote", by[".SPX"].extended, null);
eq(".SPX has no market cap", by[".SPX"].marketCap, null);
check("crypto parsed", by["BTC.CM="].price > 1000, String(by["BTC.CM="].price));
eq("unknown symbol -> error", by.ZZZQQ.error, "Symbol not found");
eq("unknown symbol has no price", by.ZZZQQ.price, undefined);
eq("symbol omitted by upstream -> error", by.OMITTED.error, "Symbol not found");

/* ============ API functions ============ */
const realFetch = window.fetch;
let calls = [];
async function withStub(stub, fn) {
  calls = [];
  window.fetch = async (url, opts) => { calls.push({ url: String(url), opts }); return stub(url, opts); };
  try { return await fn(); } finally { window.fetch = realFetch; }
}
const ok = (body) => new Response(JSON.stringify(body), { status: 200 });
const req = (path) => ({ url: "https://example.netlify.app" + path });

eq("quotes route", quotesCfg.path, "/api/quotes");
eq("search route", searchCfg.path, "/api/search");

let res = await withStub(() => ok(fixture), () =>
  quotesFn(req("/api/quotes?symbols=AAPL,.SPX,BTC.CM%3D,ZZZQQ")));
let body = await res.json();
eq("quotes status", res.status, 200);
eq("quotes content-type", res.headers.get("Content-Type"), "application/json; charset=utf-8");
check("quotes sets a CDN cache header",
  /max-age=15/.test(res.headers.get("Netlify-CDN-Cache-Control") ?? ""),
  res.headers.get("Netlify-CDN-Cache-Control"));
eq("quotes symbol order", body.quotes.map(q => q.symbol), ["AAPL", ".SPX", "BTC.CM=", "ZZZQQ"]);
eq("quotes no error", body.error, null);
check("quotes asOf is a timestamp", typeof body.asOf === "number" && body.asOf > 1e9, String(body.asOf));
eq("quotes prices the first row", body.quotes[0].price, 325.13);
eq("quotes flags the bad symbol", body.quotes[3].error, "Symbol not found");

eq("exactly one upstream call", calls.length, 1);
const upstream = new URL(calls[0].url);
eq("upstream host", upstream.host, "quote.cnbc.com");
eq("symbols are pipe-joined", upstream.searchParams.get("symbols"), "AAPL|.SPX|BTC.CM=|ZZZQQ");
eq("extended hours requested", upstream.searchParams.get("exthrs"), "1");
check("sends a User-Agent", !!calls[0].opts?.headers?.["User-Agent"], "");

res = await withStub(() => ok(fixture), () => quotesFn(req("/api/quotes")));
body = await res.json();
eq("no symbols -> empty result", body.quotes, []);
eq("no symbols -> no upstream call", calls.length, 0);

res = await withStub(() => ok(fixture), () => quotesFn(req("/api/quotes?symbols=%3Cscript%3E")));
body = await res.json();
eq("junk symbols -> no upstream call", calls.length, 0);
eq("junk symbols -> empty result", body.quotes, []);

res = await withStub(() => new Response("Too Many Requests", { status: 429 }), () =>
  quotesFn(req("/api/quotes?symbols=AAPL")));
body = await res.json();
eq("upstream 429 still returns 200", res.status, 200);
eq("upstream 429 error message", body.error, "Quote service returned HTTP 429");
eq("upstream 429 empty quotes", body.quotes, []);
eq("upstream 429 null asOf", body.asOf, null);

res = await withStub(() => { throw new TypeError("connection refused"); }, () =>
  quotesFn(req("/api/quotes?symbols=AAPL")));
body = await res.json();
eq("network failure handled", body.error, "Could not reach the quote service (TypeError)");

res = await withStub(() => { const e = new Error("aborted"); e.name = "AbortError"; throw e; }, () =>
  quotesFn(req("/api/quotes?symbols=AAPL")));
body = await res.json();
eq("timeout reported as a timeout", body.error, "Could not reach the quote service (timed out)");

res = await withStub(() => new Response("<html>not json</html>", { status: 200 }), () =>
  quotesFn(req("/api/quotes?symbols=AAPL")));
body = await res.json();
check("malformed JSON handled without throwing", typeof body.error === "string", body.error);

const yahoo = { quotes: [
  { symbol: "aapl", quoteType: "EQUITY", longname: "Apple Inc.", exchDisp: "NASDAQ" },
  { symbol: "SPY",  quoteType: "ETF",    shortname: "SPDR S&P 500", exchange: "PCX" },
  { symbol: "NOPE", quoteType: "OPTION", longname: "An option" },
  { quoteType: "EQUITY", longname: "No symbol at all" },
]};
res = await withStub(() => ok(yahoo), () => searchFn(req("/api/search?q=apple")));
body = await res.json();
eq("search uppercases symbols and drops unsupported types",
   body.results.map(r => r.symbol), ["AAPL", "SPY"]);
eq("search picks the long name", body.results[0].name, "Apple Inc.");
eq("search falls back to the short name", body.results[1].name, "SPDR S&P 500");
eq("search falls back to the raw exchange", body.results[1].exchange, "PCX");
eq("search no error", body.error, null);

res = await withStub(() => ok(yahoo), () => searchFn(req("/api/search?q=")));
body = await res.json();
eq("blank query -> empty", body.results, []);
eq("blank query -> no upstream call", calls.length, 0);

res = await withStub(() => new Response("nope", { status: 429 }), () =>
  searchFn(req("/api/search?q=apple")));
body = await res.json();
eq("search 429 degrades quietly", body.results, []);
eq("search 429 error tag", body.error, "search-unavailable");

res = await withStub(() => { throw new TypeError("boom"); }, () =>
  searchFn(req("/api/search?q=apple")));
body = await res.json();
eq("search network failure degrades quietly", body.results, []);

/* ============ analysis parsing and scoring ============ */
const bundle = await (await fetch("./analysis-fixture.json")).json();

/* -- insider classification: the vocabulary that caused a real bug -- */
eq("classify Buy",            classifyInsiderTrade("Buy"), "buy");
eq("classify Sell",           classifyInsiderTrade("Sell"), "sell");
eq("classify Automatic Sell", classifyInsiderTrade("Automatic Sell"), "planned-sell");
eq("classify vesting is NOT a buy",
   classifyInsiderTrade("Acquisition (Non Open Market)"), "grant");
eq("classify withholding is NOT a sell",
   classifyInsiderTrade("Disposition (Non Open Market)"), "withholding");
eq("classify Option Execute",  classifyInsiderTrade("Option Execute"), "exercise");
eq("classify blank",           classifyInsiderTrade(""), "other");

/* -- band interpolation -- */
eq("band below range", band(-100, [[0, 10], [10, 90]]), 10);
eq("band above range", band(999, [[0, 10], [10, 90]]), 90);
eq("band midpoint", band(5, [[0, 10], [10, 90]]), 50);
eq("band on a knot", band(10, [[0, 10], [10, 90]]), 90);
eq("band null input", band(null, [[0, 10], [10, 90]]), null);
eq("band NaN input", band(NaN, [[0, 10], [10, 90]]), null);
eq("band unsorted points still interpolate", band(5, [[10, 90], [0, 10]]), 50);

/* -- parse the real captured bundle -- */
const model = parseAnalysis(bundle.sources, "NVDA",
  { date: "2026-09-20", time: "time-after-hours", epsForecast: "1.23" });
eq("parses the name", model.name, "NVIDIA Corporation");
eq("parses the sector", model.sector, "Technology");
check("parses a price", model.price > 0, String(model.price));
check("parses fundamentals", model.fundamentals?.pe > 0, String(model.fundamentals?.pe));
check("computes volatility", model.momentum?.volatility > 0, String(model.momentum?.volatility));
check("drawdown is negative or zero", model.momentum?.maxDrawdown <= 0, String(model.momentum?.maxDrawdown));
check("builds a price series", (model.momentum?.points?.length ?? 0) > 20, String(model.momentum?.points?.length));
check("parses analyst targets", model.analysts?.mean > 0, String(model.analysts?.mean));
check("parses earnings history", (model.earnings?.history?.length ?? 0) > 0, "");
eq("earnings event days away is computed", typeof model.earnings?.next?.daysAway, "number");
check("news parsed", Array.isArray(model.news), "");
eq("grants are not counted as buys", model.insiders.counts.buy, 0);
check("grants are counted as grants", model.insiders.counts.grant > 0, String(model.insiders.counts.grant));
check("every source reported ok", Object.values(model.sources).every(v => v === "ok"),
      JSON.stringify(model.sources));

/* -- scoring -- */
const scored = scoreAnalysis(model, PRESETS.sprint.weights, 30);
check("overall score is 0-100", scored.overall >= 0 && scored.overall <= 100, String(scored.overall));
eq("one entry per factor", scored.factors.length, FACTORS.length);
check("full data gives full confidence", scored.confidence > 0.99, String(scored.confidence));
check("effective weights sum to 1",
  Math.abs(scored.factors.reduce((a, f) => a + f.effectiveWeight, 0) - 1) < 1e-9,
  String(scored.factors.reduce((a, f) => a + f.effectiveWeight, 0)));

/* A missing factor must be dropped and the rest renormalised, never scored 0. */
const stripped = { ...model, fundamentals: null, insiders: null, analysts: null };
const partial = scoreAnalysis(stripped, PRESETS.sprint.weights, 30);
check("partial data still scores", partial.overall !== null, String(partial.overall));
check("partial data lowers confidence", partial.confidence < scored.confidence,
      `${partial.confidence} vs ${scored.confidence}`);
check("missing factors are marked unavailable",
  partial.factors.filter(f => ["valuation", "quality", "sentiment", "insider"].includes(f.key))
    .every(f => !f.available), "");
check("surviving weights still sum to 1",
  Math.abs(partial.factors.reduce((a, f) => a + f.effectiveWeight, 0) - 1) < 1e-9, "");
check("dropping factors does not force the score down",
  partial.overall > 20, String(partial.overall));

/* Weights must actually change the answer, and presets must be well-formed. */
const asValue = scoreAnalysis(model, PRESETS.value.weights, 30);
check("different weights give a different score",
  Math.abs(asValue.overall - scored.overall) > 0.01,
  `${asValue.overall} vs ${scored.overall}`);
for (const [key, p] of Object.entries(PRESETS)) {
  const missing = FACTORS.filter(f => !(f.key in p.weights)).map(f => f.key);
  eq(`preset ${key} covers every factor`, missing, []);
}
const empty = scoreAnalysis({ symbol: "X", sources: {} }, PRESETS.sprint.weights, 30);
eq("an empty analysis scores null", empty.overall, null);
eq("an empty analysis has zero confidence", empty.confidence, 0);

eq("scoreBand strong", scoreBand(80).label, "Strong");
eq("scoreBand poor", scoreBand(10).label, "Poor");
eq("scoreBand null", scoreBand(null).label, "No data");

/* ============ earnings calendar: window, model and endpoint ============ */
const cal = await (await fetch("./calendar-fixture.json")).json();

/* -- the trading-day walk -- */
eq("tradingDays skips the weekend",
   tradingDays("2026-09-03", 4), ["2026-09-03", "2026-09-04", "2026-09-07", "2026-09-08"]);
eq("tradingDays starting on a Saturday moves to Monday",
   tradingDays("2026-09-05", 1), ["2026-09-07"]);
eq("tradingDays respects the cap", tradingDays("2026-09-03", 40, 3).length, 3);
/* toISOString() would convert to UTC and hand back the day before for anyone
   east of Greenwich; the walk must return the date it was asked for. */
eq("tradingDays does not shift the date across timezones",
   tradingDays(new Date(2026, 8, 3, 0, 30), 1), ["2026-09-03"]);

/* -- Nasdaq's money formatting -- */
eq("money plain", money("$1.46"), 1.46);
eq("money brackets are a loss", money("($0.04)"), -0.04);
eq("money big with commas", money("$50,132,382,000"), 50132382000);
eq("money bare number", money("11"), 11);
eq("money empty", money(""), null);
eq("money N/A", money("N/A"), null);
eq("money null", money(null), null);
eq("money leading minus", money("-$0.26"), -0.26);
eq("money garbage", money("soon"), null);

eq("session pre-market", session("time-pre-market").short, "BMO");
eq("session after-hours", session("time-after-hours").short, "AMC");
eq("session unknown falls back to TBA", session("").short, "TBA");
eq("session missing falls back to TBA", session(null).key, "tba");

eq("daysAway today", daysAway("2026-09-03", new Date(2026, 8, 3, 23, 0)), 0);
eq("daysAway tomorrow", daysAway("2026-09-04", new Date(2026, 8, 3)), 1);
eq("daysAway past is negative", daysAway("2026-09-01", new Date(2026, 8, 3)), -2);
eq("daysAway junk", daysAway("not a date"), null);

/* -- one row -- */
const lulu = parseRow({ ...cal.day1.data.rows[2], date: "2026-09-03" }, new Date(2026, 8, 3));
eq("row symbol", lulu.symbol, "LULU");
eq("row market cap", lulu.marketCap, 13020145700);
eq("row consensus", lulu.epsForecast, 1.79);
eq("row estimate count", lulu.estimates, 12);
eq("row session", lulu.session.key, "amc");
check("row EPS growth is negative for a shrinking quarter",
      lulu.epsGrowth < 0, String(lulu.epsGrowth));
eq("row hands parseAnalysis a usable event", lulu.event.date, "2026-09-03");

/* A prior-year loss makes year-on-year growth meaningless, not enormous. */
const zs = parseRow({ ...cal.day1.data.rows[1], date: "2026-09-03" });
eq("last year's loss parsed as negative", zs.lastYearEPS, -0.04);
eq("growth off a negative base is dropped, not inflated", zs.epsGrowth, null);

const blank = parseRow({ ...cal.day1.data.rows[5], date: "2026-09-03" });
eq("blank row still yields a symbol", blank.symbol, "ZZT");
eq("blank market cap is null", blank.marketCap, null);
eq("blank consensus is null", blank.epsForecast, null);
eq("blank estimate count is null", blank.estimates, null);

/* -- the endpoint -- */
eq("earnings route", earningsCfg.path, "/api/earnings");

const calStub = (url) => {
  const date = new URL(String(url)).searchParams.get("date");
  return ok(date === "2026-09-03" ? cal.day1 : date === "2026-09-04" ? cal.day2 : cal.empty);
};

let calBody = await withStub(calStub, () => buildEarnings("2026-09-03", 3));
eq("one request per trading day", calls.length, 3);
eq("days come back in order", calBody.days.map(d => d.date),
   ["2026-09-03", "2026-09-04", "2026-09-07"]);
eq("day one keeps every row", calBody.days[0].rows.length, 6);
eq("a symbol already seen is not repeated on a later day",
   calBody.days[1].rows.map(r => r.symbol), ["ORCL"]);
eq("total counts what was kept", calBody.total, 7);
eq("an empty day is still a day", calBody.days[2].rows, []);
eq("window start", calBody.from, "2026-09-03");
eq("rows carry their own date", calBody.days[0].rows[0].date, "2026-09-03");
eq("upstream formatting is passed through untouched",
   calBody.days[0].rows[0].epsForecast, "$1.46");
eq("lowercase symbols are normalised", calBody.days[0].rows[5].symbol, "ZZT");

res = await withStub(calStub, () => earningsFn(req("/api/earnings?from=2026-09-03&days=2")));
body = await res.json();
eq("earnings status", res.status, 200);
eq("earnings no error", body.error, null);
check("earnings sets a CDN cache header",
  /max-age=21600/.test(res.headers.get("Netlify-CDN-Cache-Control") ?? ""),
  res.headers.get("Netlify-CDN-Cache-Control"));
eq("earnings honours the from date", body.from, "2026-09-03");
eq("earnings honours the day count", body.days.length, 2);

res = await withStub(calStub, () => earningsFn(req("/api/earnings?from=nonsense&days=999")));
body = await res.json();
eq("a junk from date falls back to today, not an error", body.error, null);
check("an oversized window is capped", body.days.length <= 30, String(body.days.length));

/* A day the upstream refuses must not take the window down with it. */
res = await withStub((url) => new URL(String(url)).searchParams.get("date") === "2026-09-03"
      ? new Response("nope", { status: 500 }) : calStub(url),
  () => earningsFn(req("/api/earnings?from=2026-09-03&days=2")));
body = await res.json();
eq("a failed day is empty, not fatal", body.days[0].rows, []);
eq("the rest of the window survives", body.days[1].rows.map(r => r.symbol), ["ZS", "ORCL"]);

res = await withStub(() => { throw new TypeError("offline"); },
  () => earningsFn(req("/api/earnings?from=2026-09-03&days=2")));
body = await res.json();
eq("a total network failure still returns 200", res.status, 200);
eq("a total network failure yields empty days", body.total, 0);

/* -- the page model over the endpoint's shape -- */
const model2 = parseEarnings(calBody, new Date(2026, 8, 3));
eq("flattening keeps every row", model2.length, 7);
eq("flattening preserves date order", model2[model2.length - 1].symbol, "ORCL");
eq("flattened rows carry the day's date", model2[6].date, "2026-09-04");
const sum = summarise(model2);
eq("summary counts", sum.count, 7);
eq("summary counts the pre-market names", sum.bmo, 2);
eq("summary counts the after-hours names", sum.amc, 2);
eq("summary counts the $10B-and-up names", sum.largeCaps, 4);

/* ============ market news ============ */
const newsFix = await (await fetch("./news-fixture.json")).json();

eq("articleUrl absolutes a site-relative path",
   articleUrl("/articles/x"), "https://www.nasdaq.com/articles/x");
eq("articleUrl leaves an absolute url alone",
   articleUrl("https://example.com/s"), "https://example.com/s");
eq("articleUrl drops a path it cannot resolve", articleUrl("articles/x"), null);
eq("articleUrl empty", articleUrl(""), null);
eq("articleUrl null", articleUrl(null), null);

eq("standfirst strips the Key Points lead-in",
   standfirst("Key PointsLululemon reported a bad quarter."), "Lululemon reported a bad quarter.");
eq("standfirst collapses whitespace", standfirst("a   b\n c"), "a b c");
eq("standfirst empty", standfirst(""), null);
eq("standfirst that is only the lead-in is dropped", standfirst("Key Points"), null);
check("standfirst truncates with an ellipsis",
  standfirst("x".repeat(400)).length === 150 && standfirst("x".repeat(400)).endsWith("\u2026"),

/* -- codes -- */
const seq = (start) => { let n = start; return (len) =>

  !/[01ILOU]/.test(newCode(seq(3))), newCode(seq(3)));
eq("newCode is deterministic for a given byte stream", newCode(seq(5)), newCode(seq(5)));
check("different bytes give different codes", newCode(seq(0)) !== newCode(seq(11)), "");
/* Rejection sampling must not spin forever when every byte is rejected first. */
check("newCode survives a stream that starts with rejected bytes",
  newCode((() => { let first = true; return (len) => { const out = new Uint8Array(len);
    out.fill(first ? 255 : 5); first = false; return out; }; })()).length === CODE_LENGTH, "");

const g2 = applyOp(g1.state, { action: "add", symbol: "AAPL" }, 3000);

/* -- the endpoint, over an in-memory store -- */
const memStore = () => {
  const map = new Map();
  return {
    map,
    read: async (k) => (map.has(k) ? JSON.parse(map.get(k)) : null),
    write: async (k, val) => { map.set(k, JSON.stringify(val)); },
  };
};
const call = async (store, body, bytes = seq(0)) =>
  (await handleGroup(body, store, bytes, 9000)).json();

let store = memStore();
let g = await call(store, { action: "create" });
eq("create returns a valid code", isValidCode(g.code), true);
eq("create returns an empty list", g.symbols, []);
eq("create stores the group", store.map.size, 1);

g = await call(store, { action: "add", code: g.code, symbol: "aapl", by: "Will" });
eq("add through the endpoint normalises", g.symbols[0].symbol, "AAPL");
eq("add through the endpoint credits the adder", g.symbols[0].addedBy, "Will");
eq("add through the endpoint bumps the revision", g.revision, 1);

eq("an unknown action is refused at the endpoint", g.error, "Unknown action");

/* A code collision must not overwrite somebody else's list. */
const fixedBytes = () => Uint8Array.from({ length: CODE_LENGTH }, () => 0);
store = memStore();
const a = await call(store, { action: "create" }, fixedBytes);
await call(store, { action: "add", code: a.code, symbol: "AAPL" }, fixedBytes);
const b = await call(store, { action: "create" }, fixedBytes);
eq("a create that keeps colliding gives up rather than clobbering",
   b.error, "Could not allocate a group code — try again");
const still = await call(store, { action: "get", code: a.code }, fixedBytes);
eq("the existing group survives the collision", still.symbols.map(e => e.symbol), ["AAPL"]);

/* The score must read a big unplanned sale as a share of the stake. */
const insiderFactor = (model) =>
  scoreAnalysis(model, PRESETS.sprint.weights, 30).factors.find(f => f.key === "insider");
const withSales = { ...model, insiders: summary };
check("a large unplanned sale scores below neutral",
      insiderFactor(withSales).score < 50, String(insiderFactor(withSales).score));
check("the stake proportion appears as a scored input",
      insiderFactor(withSales).inputs.some(i => /share of the stake/.test(i.label)), "");

/* A bare filing count is the wrong bound: bursty filers can put eight Form 4s
   on one morning, which then reads as a quiet quarter. */
const coverage = summariseInsiders(
  [{ xml: f4Sale, filingDate: "2026-09-02", indexUrl: "i1" }],
  { coveredFrom: "2026-06-24", coveredTo: "2026-09-03", truncated: true, sinceDays: 90 });
eq("the covered window travels with the summary", coverage.coveredFrom, "2026-06-24");
eq("and its end", coverage.coveredTo, "2026-09-03");
eq("hitting the cap is flagged", coverage.truncated, true);
eq("the intended lookback is reported", coverage.sinceDays, 90);
eq("an untruncated window is not flagged",
   summariseInsiders([{ xml: f4Sale }], { truncated: false }).truncated, false);

/* -- the market-wide Form 4 tape -- */

/* EDGAR puts the accession in the path twice: undashed as the directory, then
   dashed in the filename. A pattern expecting it straight after the CIK
   matched nothing at all, and the feed came back silently empty. */
eq("parseFilingHref reads the real EDGAR path shape",
   parseFilingHref("https://www.sec.gov/Archives/edgar/data/2006392/000149315226041638/0001493152-26-041638-index.htm"),
   { cik: "2006392", accession: "0001493152-26-041638" });
eq("parseFilingHref also accepts the short form",
   parseFilingHref("/Archives/edgar/data/320193/0000320193-26-000010-index.htm").accession,
   "0000320193-26-000010");
eq("parseFilingHref rejects anything else",
   parseFilingHref("https://example.com/nope"), null);
eq("parseFilingHref tolerates nothing", parseFilingHref(null), null);

/* One request per filing: the full submission text carries the XML inline. */
const wrapped = "-----BEGIN PRIVACY-----\n<ownershipDocument><issuer>x</issuer></ownershipDocument>\ntrailing";
eq("extractOwnershipXml pulls the document out of the submission",
   extractOwnershipXml(wrapped), "<ownershipDocument><issuer>x</issuer></ownershipDocument>");
eq("extractOwnershipXml returns nothing when absent",
   extractOwnershipXml("just a header, no form"), null);
eq("extractOwnershipXml tolerates nothing", extractOwnershipXml(null), null);

/* ============ short screen ============ */

/* Crowding is judged on what these numbers normally look like. A first pass
   called 2.5 days to cover "elevated", which flagged every ordinary large cap
   and so warned about none of them. */
const sq = (over) => squeezeRisk({
  shortInterest: { daysToCover: 2.5, interest: 1e8 },
  fundamentals: { sharesOut: 1e10, marketCap: 3e12 },
  momentum: { return1m: 1 },
  ...over,
});
eq("an ordinary large cap is not flagged", sq({}).level, "low");
eq("a genuinely crowded short is high",
   sq({ shortInterest: { daysToCover: 7, interest: 1e8 } }).level, "high");
eq("an extreme one is severe",
   sq({ shortInterest: { daysToCover: 12, interest: 1e8 } }).level, "severe");
eq("a large share of stock out on loan counts too",
   sq({ shortInterest: { daysToCover: 1, interest: 2.5e9 } }).level, "severe");
/* Absent data is not evidence of safety. */
eq("missing short interest is unknown, not low",
   squeezeRisk({ fundamentals: {}, momentum: {} }).level, "unknown");
check("and it says so",
   squeezeRisk({ fundamentals: {}, momentum: {} }).reasons.join(" ").includes("unknown, not absent"), "");
/* Borrow is scarcer in small companies, and a stock already running is the
   wrong moment however good the thesis. */
eq("a small cap is nudged up from low",
   sq({ fundamentals: { sharesOut: 1e10, marketCap: 5e8 } }).level, "elevated");
check("a stock rising hard is called out",
   sq({ momentum: { return1m: 30 } }).reasons.join(" ").includes("rising into the trade"), "");

/* The screen must not be the long rating inverted: crowding stays outside the
   score, so a hazard cannot be averaged away into a middling number. */
const shortResult = scoreShort(model, SHORT_PRESETS.balanced.weights, 30);
check("a short score is produced", shortResult.overall !== null, String(shortResult.overall));
eq("one entry per short factor", shortResult.factors.length, SHORT_FACTORS.length);
check("squeeze risk is reported beside the score, not inside it",
      !!shortResult.squeeze && !shortResult.factors.some(f => /squeeze/i.test(f.key)), "");
check("effective weights sum to 1",
      Math.abs(shortResult.factors.reduce((a, f) => a + f.effectiveWeight, 0) - 1) < 1e-9, "");
eq("every preset covers every factor",
   Object.keys(SHORT_PRESETS).filter(k =>
     SHORT_FACTORS.some(f => !(f.key in SHORT_PRESETS[k].weights))), []);

/* Falling harder should read as weaker, not stronger. */
const falling = { ...model, momentum: { ...model.momentum, return1m: -25, return3m: -40, vsSma50: -20 } };
const rising  = { ...model, momentum: { ...model.momentum, return1m: 20, return3m: 35, vsSma50: 15 } };
const bd = (m) => scoreShort(m, SHORT_PRESETS.balanced.weights, 30)
  .factors.find(f => f.key === "breakdown").score;
check("a stock breaking down scores above one that is rising",
      bd(falling) > bd(rising), `${bd(falling)} vs ${bd(rising)}`);

eq("shortBand names a strong company a poor short", shortBand(20).label, "Strong — a poor short");
eq("shortBand handles no data", shortBand(null).label, "No data");

/* -- one watchlist definition, shared -- */
eq("the default watchlist is not empty", DEFAULT_SYMBOLS.length > 0, true);
check("loadWatchlist falls back to the default when nothing is stored",
      Array.isArray(loadWatchlist()), "");

/* ============ market-wide screening ============ */

const uni = [
  { symbol: "BIG",   marketCap: 500e9, price: 200, volume: 5e6 },
  { symbol: "MID",   marketCap: 5e9,   price: 40,  volume: 1e6, sector: "Technology" },
  { symbol: "SMALL", marketCap: 800e6, price: 12,  volume: 900e3, sector: "Health Care" },
  { symbol: "PENNY", marketCap: 400e6, price: 2,   volume: 4e6 },
  { symbol: "THIN",  marketCap: 3e9,   price: 30,  volume: 1000 },
  { symbol: "BRK.A", marketCap: 4e9,   price: 90,  volume: 2e6 },
];

/* Size and liquidity are not preferences here: below them the borrow is scarce
   or costly and the position cannot be closed without moving the price. */
eq("a cap band is applied",
   filterUniverse(uni, { cap: "smallmid" }).map(r => r.symbol).sort(), ["MID", "SMALL"]);
eq("sub-$5 stocks are excluded",
   filterUniverse(uni, { cap: "any" }).map(r => r.symbol).includes("PENNY"), false);
eq("illiquid names are excluded",
   filterUniverse(uni, { cap: "any" }).map(r => r.symbol).includes("THIN"), false);
eq("suffixed lines (warrants, units, preference) are excluded",
   filterUniverse(uni, { cap: "any" }).map(r => r.symbol).includes("BRK.A"), false);
eq("a sector filter narrows further",
   filterUniverse(uni, { cap: "any", sector: "Health Care" }).map(r => r.symbol), ["SMALL"]);
eq("every cap band has a label", Object.values(CAP_BANDS).filter(b => !b.label), []);
eq("every ordering has a label and a sort",
   Object.values(ORDERINGS).filter(o => !o.label || typeof o.sort !== "function"), []);

/* -- first-pass weakness -- */
const quoteFor = (over) => ({
  last: "50", yrhiprice: "100", yrloprice: "40", pe: "30", fpe: "25", psales: "6",
  ROETTM: "5%", NETPROFTTM: "2%", GROSMGNTTM: "40%", DEBTEQTYQ: "120%", ...over,
});
const cand = buildCandidate({ symbol: "TEST", sector: "Technology" }, quoteFor({}));
eq("range position is computed", Math.round(cand.rangePosition), 17);
eq("distance below the high is computed", Math.round(cand.offHigh), -50);
check("fundamentals are parsed", cand.netMargin === 2 && cand.debtToEquity === 120, "");

/* A wreck must not outrank a break in progress. Rewarding whatever has fallen
   furthest ranks a company already down 95% above one 30% off its high and
   still sliding, which is backwards: the first has had its move, and is where
   borrow is scarcest and squeezes sharpest. */
const wreck = weaknessScore(buildCandidate({ symbol: "W" },
  quoteFor({ last: "4", yrhiprice: "100", yrloprice: "3" })));
const breaking = weaknessScore(buildCandidate({ symbol: "B" },
  quoteFor({ last: "68", yrhiprice: "100", yrloprice: "60" })));
check("a break in progress outranks a wreck",
      breaking.score > wreck.score, `${breaking.score} vs ${wreck.score}`);
eq("a collapsed price is flagged rather than scored", wreck.alreadyFallen, true);
eq("and a moderate fall is not", breaking.alreadyFallen, false);

const losing = weaknessScore(buildCandidate({ symbol: "L" }, quoteFor({ NETPROFTTM: "-30%" })));
eq("loss-making is flagged", losing.lossMaking, true);
check("and it scores weaker than a profitable peer",
      losing.score > weaknessScore(buildCandidate({ symbol: "P" },
        quoteFor({ NETPROFTTM: "22%" }))).score, "");

/* Ranking must not put a company with almost nothing reported at the top. */
const ranked = rankCandidates(
  [{ symbol: "FULL" }, { symbol: "BARE" }],
  { FULL: quoteFor({}), BARE: { last: "10" } });
eq("a name with too little data is dropped", ranked.map(r => r.symbol), ["FULL"]);
check("completeness is reported", ranked[0].completeness > 0.5, String(ranked[0].completeness));
eq("an empty screen ranks to nothing", rankCandidates([], {}), []);
check("the sector list is populated", SECTORS.length > 5, String(SECTORS.length));

/* ============ filter explanations ============ */

const GUIDES = {
  "movers.html": MOVER_FILTERS,
  "shorts.html": SHORT_FILTERS,
  "insiders.html": INSIDER_FILTERS,
  "catalysts.html": CATALYST_FILTERS,
  "earnings.html": EARNINGS_FILTERS,
};

/* Every control in a page's filter form must be explained. Without this, a
   filter added later just quietly goes undocumented. Only the filter form is
   checked — the rating drawer carries its own copy. */
for (const [page, guide] of Object.entries(GUIDES)) {
  const html = await (await fetch("../static/" + page)).text();
  const form = /<form[^>]*id="filters"[\s\S]*?<\/form>/.exec(html)?.[0] ?? "";
  check(`${page} has a filter form`, form.length > 0, "");

  const labels = [];
  for (const m of form.matchAll(/<label[\s\S]*?<\/label>/g)) {
    if (!/<(select|input)[^>]*id="/.test(m[0])) continue;
    const name = /<span>([\s\S]*?)(?:<em|<\/span>)/.exec(m[0]);
    if (name) labels.push(name[1].replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim());
  }
  check(`${page} exposes filters to check`, labels.length > 0, String(labels.length));

  const explained = guide.map((e) => e.name.toLowerCase());
  const missing = labels.filter((l) => !explained.includes(l.toLowerCase()));
  eq(`${page}: every filter is explained`, missing, []);
}

/* The chips on the catalysts page are its kind filter, explained in its legend
   rather than as a form control, so the guide names it separately. */
eq("the catalysts guide covers the kind chips",
   CATALYST_FILTERS.some((e) => /kind/i.test(e.name)), true);

/* Explanations have to say something. */
for (const [page, guide] of Object.entries(GUIDES)) {
  eq(`${page}: every entry has a name`, guide.filter((e) => !e.name).length, 0);
  check(`${page}: every entry actually explains itself`,
        guide.every((e) => (e.what ?? "").length > 40),
        guide.filter((e) => (e.what ?? "").length <= 40).map((e) => e.name).join(", "));
  check(`${page}: listed options are described`,
        guide.every((e) => !e.options || e.options.every(([l, m2]) => l && m2 && m2.length > 10)), "");
}

/* The rendered markup must escape what it is given. */
/* The closing tag is written "<\/script>": inside an HTML script element a
   literal one ends the block, whatever the JavaScript around it thinks. */
const nasty = renderFilterGuide([{ name: "<script>x<\/script>", what: "a & b \"quoted\" explanation here" }]);
check("guide output escapes markup", !nasty.includes("<script>x"), "");
check("guide output escapes ampersands", nasty.includes("a &amp; b"), "");
check("guide renders a details block", nasty.startsWith("\n    <details") || nasty.trim().startsWith("<details"), "");

/* ============ daily movers ============ */

/* The session is taken from the feed, never from the clock. Working back over
   weekends alone captions Friday's moves as Monday's on every public holiday —
   which is exactly what happened on Labor Day. */
eq("parseAsOf reads the feed's own wording",
   parseAsOf("Last price as of Sep 4, 2026"), "2026-09-04");
eq("parseAsOf zero-pads", parseAsOf("Last price as of Jan 5, 2026"), "2026-01-05");
eq("parseAsOf rejects nonsense", parseAsOf("recently"), null);
eq("parseAsOf tolerates nothing", parseAsOf(null), null);

eq("toIsoDate handles the slash form", toIsoDate("9/3/2026"), "2026-09-03");
eq("toIsoDate handles the written form", toIsoDate("Sep 3, 2026"), "2026-09-03");
eq("toIsoDate rejects junk", toIsoDate("yesterday"), null);

/* Sector medians, which is what separates a company story from a sector one. */
const moves = sectorMoves([
  { sector: "Tech", changePercent: -1 }, { sector: "Tech", changePercent: -2 },
  { sector: "Tech", changePercent: -30 }, { sector: "Energy", changePercent: 4 },
  { sector: null, changePercent: 99 },
]);
eq("a sector is summarised", moves.Tech.count, 3);
/* The median resists a single violent print in a way the mean does not. */
eq("the median ignores one outlier", moves.Tech.median, -2);
check("the mean does not", Math.abs(moves.Energy.mean - 4) < 1e-9, "");
eq("rows without a sector are skipped", moves[null], undefined);

/* -- assembling an explanation -- */
const SESSION = "2026-09-04";
const earningsPayload = (over) => ({ data: { earningsSurpriseTable: { rows: [
  { dateReported: "9/3/2026", eps: 2.06, consensusForecast: "1.79", percentageSurprise: "15.08", ...over },
]}}});
const newsPayload = (rows) => ({ data: { rows } });
const sectors = { Retail: { median: 0.4, count: 60 }, Energy: { median: -6.2, count: 40 } };

const beatAndFell = explainMove(
  { symbol: "X", changePercent: -17.4, sector: "Retail" },
  { earnings: earningsPayload({}), news: newsPayload([]) }, sectors, SESSION);
const earningsEvidence = beatAndFell.evidence.find((e) => e.kind === "results");
check("results the day before are found",
      /day before/.test(earningsEvidence.headline), earningsEvidence.headline);
check("the surprise is spelled out",
      /beating by 15.1%/.test(earningsEvidence.detail), earningsEvidence.detail);
/* A beat alongside a fall is the case worth flagging, not smoothing over. */
check("beating and falling is called out",
      /Beat consensus and fell anyway/.test(earningsEvidence.contradiction ?? ""),
      String(earningsEvidence.contradiction));
eq("and the summary points at it", summariseCause(beatAndFell), "Results — but read the detail");

const missedAndRose = explainMove(
  { symbol: "Y", changePercent: 9, sector: "Retail" },
  { earnings: earningsPayload({ eps: 0.2, consensusForecast: "0.5", percentageSurprise: "-60" }),
    news: newsPayload([]) }, sectors, SESSION);
check("missing and rising is called out too",
      /Missed consensus and rose anyway/.test(
        missedAndRose.evidence.find((e) => e.kind === "results").contradiction ?? ""), "");

/* Results from months ago explain nothing about this session. */
const staleResults = explainMove(
  { symbol: "Z", changePercent: -12, sector: "Retail" },
  { earnings: earningsPayload({ dateReported: "6/1/2026" }), news: newsPayload([]) }, sectors, SESSION);
eq("stale results are not offered as a reason",
   staleResults.evidence.some((e) => e.kind === "results"), false);
eq("and with nothing else, it says so", staleResults.unexplained, true);
eq("the summary says so as well", summariseCause(staleResults), "No public cause found");

/* A stock that moved with its sector may have done nothing itself — the most
   common false story told about a mover. */
const sectorLed = explainMove(
  { symbol: "OIL", changePercent: -6.5, sector: "Energy" },
  { earnings: null, news: newsPayload([]) }, sectors, SESSION);
const sectorEvidence = sectorLed.evidence.find((e) => e.kind === "sector");
eq("a sector-wide move is treated as an explanation", sectorEvidence.strength, "strong");
eq("and summarised as one", summariseCause(sectorLed), "Moved with its sector");
check("a company-specific move is described as excess, not cause",
      beatAndFell.evidence.find((e) => e.kind === "sector").strength === "context", "");

/* Headlines from the right days only. */
const withNews = explainMove(
  { symbol: "N", changePercent: 12, sector: "Retail" },
  { earnings: null, news: newsPayload([
    { title: "Near the session", created: "Sep 4, 2026", url: "/x" },
    { title: "Long before", created: "Jul 1, 2026", url: "/y" },
  ]) }, sectors, SESSION);
const newsEvidence = withNews.evidence.find((e) => e.kind === "coverage");
eq("only headlines around the session count", newsEvidence.articles.length, 1);
eq("and the url is made absolute", newsEvidence.articles[0].url, "https://www.nasdaq.com/x");
eq("news alone is summarised as news", summariseCause(withNews), "In the news");

eq("nothing at all is unexplained",
   explainMove({ symbol: "Q", changePercent: 20 }, {}, {}, SESSION).unexplained, true);

const failed = results.filter(r => !r.ok);
document.getElementById("out").innerHTML = results.map(r =>
  `<span class="${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"}</span>  ${r.name}` +
  (r.ok ? "" : `\n        ${r.detail}`)).join("\n");
document.getElementById("summary").textContent =
  `${results.length - failed.length}/${results.length} passed` +
  (failed.length ? `  \u2014 ${failed.length} FAILING` : "  \u2014 all green");
document.getElementById("summary").className = failed.length ? "fail" : "pass";
</script>
